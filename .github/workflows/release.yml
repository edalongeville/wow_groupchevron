name: Release

# Two ways to release, both ending in the same packaging step (BigWigs packager: CurseForge
# upload + GitHub release):
#
#  1. Button: Actions -> Release -> Run workflow, choose the bump (major / minor / patch) and run.
#     The workflow bumps `## Version` in GroupChevron/GroupChevron.toc, runs the lint and tests,
#     commits "Release vX.Y.Z" to main, tags it and packages it. "dry_run" does everything up to
#     the tests and stops there (nothing is committed, tagged or uploaded).
#  2. Tag: push a tag `v<version>` that matches `## Version` in the .toc.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   CF_API_TOKEN CurseForge API token (https://www.curseforge.com/account/api-tokens)
# And in GroupChevron/GroupChevron.toc:
#   ## X-Curse-Project-ID: 1808085
#
# The button pushes a commit and a tag to main with the workflow's own token, so main's branch
# protection must not require status checks (the workflow runs the tests itself before pushing).
# Pushes made with that token do not start other workflows, so the tag it creates does not
# start this one a second time.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Dry run (bump and test only, no commit, tag or upload)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write   # push the release commit and tag, create the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main (selected: ${GITHUB_REF_NAME})"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the packager builds the changelog from the tag history

      - name: Bump the version
        id: bump
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          toc=GroupChevron/GroupChevron.toc
          old=$(sed -n 's/^## Version:[[:space:]]*//p' "$toc" | tr -d '\r' | head -1)
          if ! [[ "$old" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error file=$toc::## Version '$old' is not x.y.z"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
          esac
          new="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::Tag v$new already exists"
            exit 1
          fi
          sed -i "s/^## Version:.*/## Version: $new/" "$toc"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "### Release $old -> $new ($BUMP)" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag matches the .toc version
        if: github.event_name == 'push'
        run: |
          toc=$(sed -n 's/^## Version:[[:space:]]*//p' GroupChevron/GroupChevron.toc | tr -d '\r' | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${toc}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match .toc version v${toc}"
            exit 1
          fi

      - name: Install Lua tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 lua-check lua-busted

      - name: Lint and test
        run: |
          luacheck .
          busted --lua=lua5.1 spec

      - name: Commit and tag the release
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${VERSION}"
          git tag -a "v${VERSION}" -m "GroupChevron ${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"

      - name: Package and upload
        if: ${{ !inputs.dry_run }}
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
